<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Select2 en Modal</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        /* Estilos del sistema */
        body .select2-dropdown {
            z-index: 99999 !important;
        }

        .select2-container {
            width: 100% !important;
            display: block !important;
        }

        .select2-container--default .select2-selection--single {
            height: 38px !important;
            border: 1px solid #ced4da !important;
            border-radius: 0.25rem !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 36px !important;
            padding-left: 12px !important;
            color: #495057 !important;
        }

        .select2-container--open {
            z-index: 99999 !important;
        }

        #testModal .modal-body {
            overflow: visible !important;
        }

        .card {
            overflow: visible !important;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Test de Select2 en Modal Bootstrap</h2>
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#testModal">
            Abrir Modal de Prueba
        </button>
    </div>

    <!-- Modal de Prueba -->
    <div class="modal fade" id="testModal" tabindex="-1" role="dialog" style="z-index: 1050;">
        <div class="modal-dialog modal-xl" role="document">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Test de Select2 - Selección de Docentes</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body" style="overflow: visible !important;">
                    <div class="row">
                        <div class="col-lg-6 mb-3">
                            <div class="card">
                                <div class="card-header bg-info text-white">
                                    <strong>MODULO I</strong>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label><strong>Código Módulo:</strong></label>
                                        <input type="text" class="form-control" value="MODULO I" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label><strong>Nombre del Módulo:</strong></label>
                                        <input type="text" class="form-control" placeholder="Nombre del módulo">
                                    </div>
                                    <div class="form-group mb-0">
                                        <label><strong>Docente Asignado:</strong></label>
                                        <select class="form-control select2-docente" id="docente1" style="width: 100%;">
                                            <option value="">-- Seleccionar Docente --</option>
                                            <option value="1">JUAN PÉREZ LÓPEZ - ODONTOLOGÍA</option>
                                            <option value="2">MARÍA GARCÍA TORRES - ORTODONCIA</option>
                                            <option value="3">CARLOS UGARTE CARRILLO - ODONTÓLOGO</option>
                                            <option value="4">ANA MARTÍNEZ FLORES - ENDODONCIA</option>
                                            <option value="5">PEDRO SÁNCHEZ RAMÍREZ - PERIODONCIA</option>
                                        </select>
                                        <small class="form-text text-muted">
                                            <i class="fa fa-info-circle"></i> Seleccione un docente de la lista
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6 mb-3">
                            <div class="card">
                                <div class="card-header bg-info text-white">
                                    <strong>MODULO II</strong>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label><strong>Código Módulo:</strong></label>
                                        <input type="text" class="form-control" value="MODULO II" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label><strong>Nombre del Módulo:</strong></label>
                                        <input type="text" class="form-control" placeholder="Nombre del módulo">
                                    </div>
                                    <div class="form-group mb-0">
                                        <label><strong>Docente Asignado:</strong></label>
                                        <select class="form-control select2-docente" id="docente2" style="width: 100%;">
                                            <option value="">-- Seleccionar Docente --</option>
                                            <option value="1">JUAN PÉREZ LÓPEZ - ODONTOLOGÍA</option>
                                            <option value="2">MARÍA GARCÍA TORRES - ORTODONCIA</option>
                                            <option value="3">CARLOS UGARTE CARRILLO - ODONTÓLOGO</option>
                                            <option value="4">ANA MARTÍNEZ FLORES - ENDODONCIA</option>
                                            <option value="5">PEDRO SÁNCHEZ RAMÍREZ - PERIODONCIA</option>
                                        </select>
                                        <small class="form-text text-muted">
                                            <i class="fa fa-info-circle"></i> Seleccione un docente de la lista
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-success">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        $(document).ready(function() {
            // Inicializar Select2 cuando se abre el modal
            $('#testModal').on('shown.bs.modal', function () {
                $('.select2-docente').select2({
                    placeholder: '-- Seleccionar Docente --',
                    allowClear: true,
                    dropdownParent: $('#testModal'),
                    width: '100%'
                });
            });

            // Destruir Select2 cuando se cierra el modal
            $('#testModal').on('hidden.bs.modal', function () {
                $('.select2-docente').select2('destroy');
            });
        });
    </script>
</body>
</html>
